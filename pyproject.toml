[project]
name = "dao-modman"
authors = [{ name = "Sebastian Mahr" }]
dynamic = ["version"]
description = "Terminal mod manager for Dragon Age: Origins"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["dragon age", "dragon age origins", "mod manager", "modding", "nexus mods", "proton", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Games/Entertainment :: Role-Playing",
]
dependencies = [
    "textual>=8.0",
    "httpx2>=2.16.0",
    "tomli-w>=1.0",
    "py7zr>=0.21",
    "brotli>=1.2.1",  # used by py7zr on downloaded archives; older versions are exploitable
    "pathspec>=0.12",
]

[project.urls]
Homepage = "https://github.com/DrHarib0/dao-modman"
Documentation = "https://github.com/DrHarib0/dao-modman/blob/main/docs/Readme.md"
Issues = "https://github.com/DrHarib0/dao-modman/issues"
Changelog = "https://github.com/DrHarib0/dao-modman/releases"

[project.scripts]
dao-modman = "dao_modman.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.17.1", "textual-dev>=1.5"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"  # from the git tags: vX.Y.Z on a release, X.Y.(Z+1).devN+g<hash> after it

[tool.uv]
# rebuild the version when HEAD or the tags change, not only when pyproject.toml does
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/dao_modman"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
