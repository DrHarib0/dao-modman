# Predefined path operations for mods that only work when installed at a specific place.
#
# An entry is identified by the Nexus mod id and file id. Operations have the same form as
# in a mod's mod.toml; {mod} stands for the mod's own override folder
# (packages/core/override/<mod-id>), which differs from one library to the next.
#
# The same file in ~/.config/dao-modman/ adds entries, and wins over an entry here for the
# same mod and file.

[[preset]]
mod_id = 1825
file_id = 9280
description = "The bundled exe has hardcoded paths. For the mod to work, the exe needs to be placed in override/siramods_items"

[[preset.ops]]
op = "rename"
from = "{mod}/ADD_ITEM_DELUXE_1_1/siramods_items"
to = "packages/core/override/siramods_items"

[[preset]]
mod_id = 1110
file_id = 5571
description = "The game only reads fonts.erf from packages/core/data, not from the override folder"

[[preset.ops]]
op = "rename"
from = "{mod}/fonts.erf"
to = "packages/core/data/fonts.erf"
