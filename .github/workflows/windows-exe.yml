# dao-modman.exe for Windows (PyApp), zipped with packaging/windows/README.txt, kept as the
# artifact `dao-modman-windows`. The release workflow calls it with the version it is about to
# tag and puts the zip on the release; it also runs on a push that changes the build, and by
# hand (gh workflow run windows-exe.yml --ref <branch>), labelled from the git tags.
name: Windows exe

on:
  push:
    paths:
      - "packaging/windows/**"
      - ".github/workflows/windows-exe.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Version of the coming release, e.g. 0.6.1 (empty: from the git tags)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest # Rust comes with the runner image
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # without a given version, it comes from the git tags
      - name: Build dao-modman.exe
        shell: pwsh
        env:
          PYAPP_PROJECT_VERSION: ${{ inputs.version }}
        run: ./packaging/windows/build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: dao-modman-windows
          path: dist/dao-modman-windows.zip
