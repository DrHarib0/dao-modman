# git-cliff configuration: release notes, changelog and the next version from conventional
# commits.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project. Generated by [git-cliff](https://git-cliff.org) from
the conventional commit messages."""
body = """
{%- if version %}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else %}
## Unreleased
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
{% if commit.breaking %}**breaking:** {% endif %}\
{{ commit.message | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/DrHarib0/dao-modman/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}"""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactoring" },
    { message = "^docs?", group = "<!-- 4 -->Documentation" },
    { message = "^deps", group = "<!-- 5 -->Dependencies" },
    { message = "^(build|ci)", group = "<!-- 6 -->Build and CI" },
    { message = "^test", group = "<!-- 7 -->Tests" },
    { message = "^revert", group = "<!-- 8 -->Reverts" },
    { message = ".*", group = "<!-- 9 -->Other" },
]
filter_commits = false
topo_order = false
sort_commits = "oldest"

[bump]
# feat: bumps the minor version; while on 0.x, a breaking change does too (1.0.0 is
# a deliberate step, made with the release workflow's version input)
features_always_bump_minor = true
breaking_always_bump_major = false
