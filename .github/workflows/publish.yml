# Started by hand (Actions → Release → Run workflow, or `gh workflow run publish.yml`):
# tests, the next version from the conventional commits (git-cliff), the package and
# dao-modman.exe for Windows built as that version, then the tag on the tested commit and a
# GitHub release with that version's changelog as notes and the Windows zip, then the package
# on PyPI.
#
# Releases are immutable once published, so everything they carry is built first, with the
# version passed in instead of read from a tag that does not exist yet. A failed build leaves
# neither tag nor release behind, and the release can simply be started again.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0 (empty: derived from the commits)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  GIT_CLIFF: git-cliff==2.14.2

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Determine the version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          if [ -n "$REQUESTED" ]; then
            tag="v${REQUESTED#v}"
          else
            tag="$(uvx "$GIT_CLIFF" --bumped-version)"
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists"
            exit 1
          fi
          echo "Releasing $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv build
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.version }} # no tag yet
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  windows-exe:
    needs: version
    uses: ./.github/workflows/windows-exe.yml
    with:
      version: ${{ needs.version.outputs.version }}

  github-release:
    needs: [version, build, windows-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag, create the GitHub release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git-cliff writes the notes from the history
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/download-artifact@v8
        with:
          name: dao-modman-windows
      - name: Tag the tested commit and create the GitHub release, with the Windows zip
        env:
          TAG: ${{ needs.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          uvx "$GIT_CLIFF" --unreleased --tag "$TAG" --strip header > notes.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "${TAG#v}" --notes-file notes.md --verify-tag \
            dao-modman-windows.zip

  publish:
    needs: [build, github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dao-modman/
    permissions:
      id-token: write # trusted publishing, no token needed
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv publish
